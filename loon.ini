[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果

loon_rule_base=https://raw.githubusercontent.com/Yunhui/subconfig/rm/base/loon.conf

;设置规则标志位
;本地地址和域名直连
ruleset=全球直连,https://direct.sleepstars.de/geosite/PRIVATE
ruleset=全球直连,[]GEOIP,private,no-resolve
ruleset=全球直连,https://direct.sleepstars.de/geosite/geolocation-cn

;国内游戏域名直连
ruleset=全球直连,https://direct.sleepstars.de/geosite/CATEGORY-GAMES-CN
;各大游戏平台下载域名直连
ruleset=全球直连,https://direct.sleepstars.de/geosite/category-game-platforms-download
;BT Tracker 相关域名直连
ruleset=全球直连,https://direct.sleepstars.de/geosite/category-public-tracker


ruleset=节点选择,https://rule.kelee.one/Loon/GitHub.lsr

ruleset=数字货币,https://rule.kelee.one/Loon/Crypto.lsr
ruleset=数字货币,https://rule.kelee.one/Loon/Cryptocurrency.lsr
ruleset=AI,https://kelee.one/Tool/Loon/Lsr/AI.lsr
ruleset=Apple,https://rule.kelee.one/Loon/Apple.lsr
ruleset=Microsoft,https://rule.kelee.one/Loon/Microsoft.lsr
ruleset=国外媒体,https://direct.sleepstars.de/geosite/category-entertainment
ruleset=游戏平台,https://direct.sleepstars.de/geosite/category-games
;即时通讯包括了 Telegram/WhatsApp/Line 等海外主流即时通讯软件域名
ruleset=即时通讯,https://direct.sleepstars.de/geosite/category-communication
ruleset=即时通讯,[]GEOIP,telegram,no-resolve

ruleset=节点选择,https://direct.sleepstars.de/geosite/gfw
ruleset=全球直连,https://direct.sleepstars.de/geosite/cn
ruleset=全球直连,[]GEOIP,CN
ruleset=漏网之鱼,[]FINAL

;设置分组标志位
custom_proxy_group=自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=节点选择`select`[]自动选择`[]DIRECT`[]HK`[]TW`[]SG`[]JP`[]USA`.*
custom_proxy_group=即时通讯`select`[]节点选择`[]HK`[]TW`[]JP`[]SG`[]USA
custom_proxy_group=国外媒体`select`[]节点选择`[]HK`[]TW`[]JP`[]SG`[]USA`[]DIRECT
custom_proxy_group=数字货币`select`[]HK`[]TW`[]JP`[]SG`[]USA`.*
custom_proxy_group=游戏平台`select`[]DIRECT`[]节点选择`[]HK`[]TW`[]JP`[]SG`[]USA
custom_proxy_group=AI`select`[]节点选择`[]USA`[]HK`[]TW`[]SG`[]JP
custom_proxy_group=Microsoft`select`[]DIRECT`[]节点选择`[]USA`[]HK`[]TW`[]SG`[]JP
custom_proxy_group=Apple`select`[]DIRECT`[]节点选择`[]USA`[]HK`[]TW`[]SG`[]JP
custom_proxy_group=全球直连`select`[]DIRECT`[]节点选择
custom_proxy_group=漏网之鱼`select`[]节点选择`[]HK`[]TW`[]JP`[]SG`[]USA`[]DIRECT
custom_proxy_group=HK`url-test`(港|HK|Hong Kong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=JP`url-test`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=USA`url-test`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)`http://www.gstatic.com/generate_204`300,,150
custom_proxy_group=TW`url-test`(台|新北|彰化|TW|Taiwan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=SG`url-test`(新加坡|坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50


exclude_remarks=(到期|Expire|流量|Traffic|剩余|天|时间|官网|产品|平台)

;下方参数请勿修改
enable_rule_generator=true
overwrite_original_rules=true
