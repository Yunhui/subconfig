[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果


quanx_rule_base=https://raw.githubusercontent.com/Yunhui/subconfig/rm/base/quanx.conf
loon_rule_base=https://raw.githubusercontent.com/Yunhui/subconfig/rm/base/loon.conf

;本地地址和域名直连
ruleset=全球直连,https://surge.bojin.co/geosite/private,28800
ruleset=全球直连,[]GEOIP,private,no-resolve
ruleset=全球直连,https://surge.bojin.co/geosite/tld-cn,28800

ruleset=全球直连,https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Custom_Direct.list,28800
;ruleset=手动选择,https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Custom_Proxy.list,28800
;国内游戏域名直连
ruleset=全球直连,https://surge.bojin.co/geosite/category-games@cn,28800
;各大游戏平台下载域名直连
ruleset=全球直连,https://surge.bojin.co/geosite/category-game-platforms-download,28800
;BT Tracker 相关域名直连
ruleset=全球直连,https://surge.bojin.co/geosite/category-public-tracker,28800

ruleset=数字货币,https://surge.bojin.co/geosite/category-cryptocurrency,28800
ruleset=AI,https://surge.bojin.co/geosite/category-ai-!cn,28800

ruleset=Apple,https://surge.bojin.co/geosite/apple,28800
ruleset=节点选择,https://surge.bojin.co/geosite/github,28800
ruleset=节点选择,https://surge.bojin.co/geosite/github1s,28800
ruleset=Microsoft,https://surge.bojin.co/geosite/microsoft,28800

ruleset=国外媒体,https://surge.bojin.co/geosite/category-social-media-!cn,28800
ruleset=游戏平台,https://surge.bojin.co/geosite/category-games,28800

;即时通讯包括了 Telegram/WhatsApp/Line 等海外主流即时通讯软件域名
ruleset=即时通讯,https://surge.bojin.co/geosite/category-communication,28800

;由于 OpenClash 使用的大陆白名单收录不全，此处留有 geosite:cn 作为国内域名兜底
ruleset=全球直连,https://surge.bojin.co/geosite/cn,28800
;由于 OpenClash 使用的大陆白名单收录不全，此处留有 geoip:cn 作为国内 IP 兜底
ruleset=全球直连,[]GEOIP,cn,no-resolve
ruleset=漏网之鱼,[]FINAL
;设置规则标志位

;设置分组标志位
custom_proxy_group=自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=节点选择`select`[]自动选择`[]DIRECT`[]HK`[]TW`[]SG`[]JP`[]USA`.*
custom_proxy_group=即时通讯`select`[]节点选择`[]HK`[]TW`[]JP`[]SG`[]USA`[]DIRECT
custom_proxy_group=国外媒体`select`[]节点选择`[]HK`[]TW`[]JP`[]SG`[]USA`[]DIRECT
custom_proxy_group=数字货币`select`[]节点选择`[]HK`[]TW`[]JP`[]SG`[]USA
custom_proxy_group=游戏平台`select`[]DIRECT`[]节点选择`[]HK`[]TW`[]JP`[]SG`[]USA
custom_proxy_group=AI`select`[]DIRECT`[]节点选择`[]USA`[]HK`[]TW`[]SG`[]JP
custom_proxy_group=Microsoft`select`[]DIRECT`[]节点选择`[]USA`[]HK`[]TW`[]SG`[]JP
custom_proxy_group=Apple`select`[]DIRECT`[]节点选择`[]USA`[]HK`[]TW`[]SG`[]JP
custom_proxy_group=全球直连`select`[]DIRECT`[]节点选择
custom_proxy_group=漏网之鱼`select`[]节点选择`[]HK`[]TW`[]JP`[]SG`[]USA`[]DIRECT
custom_proxy_group=HK`url-test`(港|HK|Hong Kong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=JP`url-test`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=USA`url-test`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)`http://www.gstatic.com/generate_204`300,,150
custom_proxy_group=TW`url-test`(台|新北|彰化|TW|Taiwan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=SG`url-test`(新加坡|坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50
;设置分组标志位


;下方参数请勿修改
enable_rule_generator=true
overwrite_original_rules=true
